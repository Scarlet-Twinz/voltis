name: VOLTIS one-time UI and action fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[voltis-auto-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch DashboardShell
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/web/components/DashboardShell.tsx')
          text = path.read_text(encoding='utf-8-sig')

          old = '''        await api.accounts.get(\n          readString(parsed.id, ""),\n        );'''
          new = '''        await api.accounts.create({\n          organizationId,\n          ...parsed,\n        });'''
          if old not in text:
              raise SystemExit('account action target not found')
          text = text.replace(old, new, 1)

          old = '''        await api.transactions.get(\n          readString(parsed.id, ""),\n        );'''
          new = '''        await api.transactions.create({\n          organizationId,\n          ...parsed,\n        });'''
          if old not in text:
              raise SystemExit('transaction action target not found')
          text = text.replace(old, new, 1)

          old = '''  const [settingsSaving, setSettingsSaving] =\n    useState(false);'''
          new = '''  const [settingsSaving, setSettingsSaving] =\n    useState(false);\n\n  const [settingsCurrency, setSettingsCurrency] =\n    useState("NGN");'''
          if old not in text:
              raise SystemExit('settings state target not found')
          text = text.replace(old, new, 1)

          old = '''  useEffect(() => {\n    document.documentElement.dataset.theme = theme;\n    window.localStorage.setItem(\n      "voltis_theme",\n      theme,\n    );\n  }, [theme]);'''
          new = '''  useEffect(() => {\n    document.documentElement.dataset.theme = theme;\n    window.localStorage.setItem(\n      "voltis_theme",\n      theme,\n    );\n  }, [theme]);\n\n  useEffect(() => {\n    if (organization?.defaultCurrency) {\n      setSettingsCurrency(organization.defaultCurrency);\n    }\n  }, [organization?.defaultCurrency]);'''
          if old not in text:
              raise SystemExit('currency sync target not found')
          text = text.replace(old, new, 1)

          old = '''  async function runReconciliation() {'''
          new = '''  async function saveSettings() {\n    if (!organizationId) {\n      return;\n    }\n\n    try {\n      setSettingsSaving(true);\n      setError("");\n\n      const updated = await api.organizations.update(\n        organizationId,\n        { defaultCurrency: settingsCurrency },\n      );\n\n      setOrganization(updated);\n      setSettingsCurrency(updated.defaultCurrency);\n    } catch (err) {\n      setError(\n        err instanceof Error\n          ? err.message\n          : "Unable to save organization settings.",\n      );\n    } finally {\n      setSettingsSaving(false);\n    }\n  }\n\n  async function runReconciliation() {'''
          if old not in text:
              raise SystemExit('save settings insertion target not found')
          text = text.replace(old, new, 1)

          old = '''                    <SettingRow\n                      label="Default currency"\n                      value={\n                        currency\n                      }\n                    />'''
          new = '''                    <div className="setting-row setting-row-control">\n                      <span>Default currency</span>\n                      <select\n                        className="settings-select"\n                        value={settingsCurrency}\n                        onChange={(event) =>\n                          setSettingsCurrency(event.target.value)\n                        }\n                        aria-label="Default currency"\n                      >\n                        {['NGN', 'USD', 'EUR', 'GBP', 'GHS', 'KES', 'ZAR'].map((code) => (\n                          <option key={code} value={code}>\n                            {code}\n                          </option>\n                        ))}\n                      </select>\n                    </div>'''
          if old not in text:
              raise SystemExit('currency control target not found')
          text = text.replace(old, new, 1)

          old = '''                  <button\n                    type="button"\n                    className="secondary-button"\n                    disabled={\n                      settingsSaving\n                    }\n                    onClick={async () => {\n                      setSettingsSaving(\n                        true,\n                      );\n\n                      await new Promise(\n                        (resolve) =>\n                          setTimeout(\n                            resolve,\n                            250,\n                          ),\n                      );\n\n                      setSettingsSaving(\n                        false,\n                      );\n                    }}\n                  >'''
          new = '''                  <button\n                    type="button"\n                    className="secondary-button"\n                    disabled={settingsSaving}\n                    onClick={saveSettings}\n                  >'''
          if old not in text:
              raise SystemExit('save button target not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Add settings control styles
        shell: bash
        run: |
          cat >> apps/web/app/voltis-overrides.css <<'CSS'

          .setting-row-control {
            align-items: center;
          }

          .settings-select {
            min-width: 128px;
            height: 38px;
            padding: 0 34px 0 11px;
            border: 1px solid var(--border-strong);
            border-radius: 9px;
            background: var(--surface-2);
            color: var(--text);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
          }

          .settings-select:hover {
            border-color: rgba(92, 168, 255, 0.28);
          }

          @media (max-width: 720px) {
            .setting-row-control {
              align-items: stretch;
            }

            .settings-select {
              width: 100%;
            }
          }
          CSS

      - name: Commit patched application
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/voltis-ui-fix.yml
          git add apps/web/components/DashboardShell.tsx apps/web/app/voltis-overrides.css .github/workflows/voltis-ui-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: complete VOLTIS dashboard controls [voltis-auto-fix]"
          git push
